version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamforge-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - RATE_LIMIT_INFO=30/minute
      - RATE_LIMIT_DOWNLOAD=10/minute
      - TEMP_DIR=/app/temp_downloads
      # Optional: To bypass strict YouTube IP blocks in production, configure residential proxy:
      # - YOUTUBE_PROXY=http://user:password@proxy.example.com:8080
      # Optional: Path to exported cookies.txt for bot bypass
      # - YOUTUBE_COOKIES_FILE=/app/cookies.txt
    # Mount an ephemeral in-memory tmpfs for FFmpeg muxing buffer (fast I/O & zero permanent disk wear)
    tmpfs:
      - /app/temp_downloads:size=2G,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - streamforge-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: streamforge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - streamforge-network

networks:
  streamforge-network:
    driver: bridge
